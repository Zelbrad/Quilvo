# Build Quilvo.exe on Windows.
# - Push to dev: the zip is attached to the Actions run as a test build (no release).
# - Push a tag matching the version in flow.py (git tag v1.1.0; git push origin v1.1.0):
#   the zip is attached to a GitHub release.
name: Release

on:
  push:
    branches: [dev]
    tags: ["v*"]

permissions:
  contents: write
  id-token: write        # build attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path flow.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Check tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: if ("v$env:VERSION" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match flow.py __version__ $env:VERSION" }

      # Create .venv-build with setup-python's interpreter so build.ps1 skips its own `py -3` step
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv-build
          .\.venv-build\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-build\Scripts\python.exe -m pip install -r requirements-lock.txt

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Check the exe exists
        shell: pwsh
        run: if (-not (Test-Path dist\Quilvo\Quilvo.exe)) { throw "dist\Quilvo\Quilvo.exe missing" }

      - name: Upload test build
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: Quilvo-${{ env.VERSION }}-dev-${{ github.sha }}
          path: dist/Quilvo/                 # GitHub zips artifacts itself; avoids a zip inside a zip
          retention-days: 14

      # Runs on dev too, so the script is tested before a release needs it
      - name: Checksum
        shell: pwsh
        run: |
          $zip = "Quilvo-$env:VERSION-win64.zip"
          $hash = (Get-FileHash "dist\$zip" -Algorithm SHA256).Hash.ToLower()
          @"
          ### Verify the download
          SHA-256 of ``$zip``:
          ``````
          $hash
          ``````
          Check it in PowerShell with ``Get-FileHash $zip``, or confirm it was built from this repo with ``gh attestation verify $zip -R ${{ github.repository }}``.
          "@ | Set-Content dist\release-body.md -Encoding utf8
          Get-Content dist\release-body.md

      # Proves the zip was built by this workflow from this repo (the exe isn't code-signed)
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: dist/Quilvo-${{ env.VERSION }}-win64.zip

      # The checksum section goes first, then GitHub's generated "What's changed" (merged PRs)
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Quilvo-${{ env.VERSION }}-win64.zip
          name: Quilvo ${{ env.VERSION }}
          body_path: dist/release-body.md
          generate_release_notes: true
